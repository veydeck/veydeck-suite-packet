name: 功能需求
description: 提出 veydeck-suite-packet 的新能力或行为改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: summary
    attributes:
      label: 需求描述
      description: 描述希望新增或改进什么，以及它解决什么问题。
      placeholder: 例如：需要支持新的数据包输入格式或分析维度。
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响模块
      multiple: true
      options:
        - 输入格式
        - 数据包解析
        - 规则处理
        - 结果模型
        - Veydeck 集成
        - 配置/部署
        - 文档
        - 其他
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 记录示例、参考链接、备选方案或验收标准。
    validations:
      required: false
