[project]
name = "veydeck-packet"
version = "0.1.0-alpha.1"
description = "PCAP Analysis & Packet Builder"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "veydeck-suite-runtime-sdk==0.1.0a1",
  "fastapi>=0.138.1",
  "pydantic-settings>=2.14.2",
  "python-multipart>=0.0.32",
  "scapy>=2.7.0",
  "sqlalchemy>=2.0.51",
  "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
